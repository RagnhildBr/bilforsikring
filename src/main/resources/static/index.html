<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Kjøp Bilforsikring</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <h1>Kjøp Bilforsikring</h1>
        <form id="purchaseForm">
            <input type="text" id="customerId" placeholder="Kundenummer" required>
            <input type="text" id="registrationNumber" placeholder="Registreringsnummer" required>
            <input type="text" id="bonus" placeholder="Bonus">
            <button type="submit">Kjøp</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
