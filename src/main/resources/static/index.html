<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kjøp Bilforsikring</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
    <h1>Kjøp Bilforsikring</h1>

    <p class="intro">
        Det er fire forskjellige forsikringer å velge mellom.
        Ansvarsforsikring er lovpålagt om kjøretøyet er registrert og
        skal brukes på veien. I tillegg kan du utvide forsikringen
        avhengig av hvor gammel bilen din er og hvordan du bruker den.
    </p>

    <form id="purchaseForm">
        <div class="field">
            <label for="registrationNumber">Bilens registreringsnummer</label>
            <input
                    type="text"
                    id="registrationNumber"
                    name="registrationNumber"
                    placeholder="F.eks. AB 12345"
                    required
            >
            <span class="field-error"></span>
        </div>

        <div class="field">
            <!-- Lacking domain knowledge about how this should be handled -->
            <label for="bonus">Din bonus</label>
            <select id="bonus" name="bonus" required>
                <option value="" disabled selected>Velg bonus</option>
                <option value="0">0 %</option>
                <option value="20">20 %</option>
                <option value="40">40 %</option>
                <option value="60">60 %</option>
                <option value="70">70 %</option>
                <option value="75">75 %</option>
            </select>
            <span class="field-error"></span>
        </div>

        <div class="field">
            <label for="personalNumber">Fødselsnummer</label>
            <input
                    type="text"
                    id="personalNumber"
                    name="personalNumber"
                    inputmode="numeric"
                    pattern="[0-9]{11}"
                    maxlength="11"
                    required
            >
            <span class="field-error"></span>
        </div>

        <div class="name-fields">
            <div class="field">
                <label for="firstName">Fornavn</label>
                <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        autocomplete="given-name"
                        required
                >
                <span class="field-error"></span>
            </div>

            <div class="field">
                <label for="lastName">Etternavn</label>
                <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        autocomplete="family-name"
                        required
                >
                <span class="field-error"></span>
            </div>
        </div>

        <div class="field">
            <label for="email">E-post</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    aria-describedby="emailError"
                    required
            >
            <span id="emailError" class="field-error"></span>
        </div>

        <div class="actions">
            <button type="submit" class="button-primary">Kjøp</button>
            <button type="reset" class="button-secondary">Avbryt</button>
        </div>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
</main>

<script src="js/app.js"></script>
</body>
</html>
